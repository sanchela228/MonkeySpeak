name: Release

on:
  push:
    branches: [ "master" ]

jobs:

  read-version:
    runs-on: ubuntu-latest
    outputs:
      appVersion: ${{ steps.ver.outputs.appVersion }}
      backendVersion: ${{ steps.ver.outputs.backendVersion }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          echo "appVersion=$(jq -r .appVersion version.json)" >> $GITHUB_OUTPUT
          echo "backendVersion=$(jq -r .backendVersion version.json)" >> $GITHUB_OUTPUT

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet test sources/Backend.Tests/Backend.Tests.csproj

  build-backend-image:
    needs: [read-version, test-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Backend.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/monkeyspeak-backend:latest
            ghcr.io/${{ github.repository_owner }}/monkeyspeak-backend:v${{ needs.read-version.outputs.backendVersion }}

  build-maui-windows:
    needs: [read-version, test-backend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workloads
        run: dotnet workload install maui

      - name: Publish MAUI app
        run: |
          dotnet publish sources/NewAppMaui/NewAppMaui.csproj `
            -c Release `
            -f net10.0-windows10.0.19041.0 `
            -r win-x64 `
            --self-contained true `
            -p:ApplicationDisplayVersion=${{ needs.read-version.outputs.appVersion }} `
            -o build/publish

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Pack with Velopack
        run: |
          vpk pack `
            --packId MonkeySpeak `
            --packVersion ${{ needs.read-version.outputs.appVersion }} `
            --packDir build/publish `
            --outputDir build/releases

      - uses: actions/upload-artifact@v4
        with:
          name: velopack-releases
          path: build/releases/

  create-release:
    needs: [read-version, build-backend-image, build-maui-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: velopack-releases
          path: releases/

      - name: List release files
        run: ls -la releases/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.read-version.outputs.appVersion }}
          name: MonkeySpeak v${{ needs.read-version.outputs.appVersion }}
          files: releases/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
