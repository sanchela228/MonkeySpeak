name: Build & Test

on:
  pull_request:
    branches: [ "master" ]

jobs:

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet test sources/Backend.Tests/Backend.Tests.csproj

  build-maui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install maui-windows
      - run: dotnet build sources/NewAppMaui/NewAppMaui.csproj -f net10.0-windows10.0.19041.0
